<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0e0b08" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230e0b08'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23d8a94a' font-family='Georgia,serif'%3ET%3C/text%3E%3C/svg%3E" />
  <title>Toasty Toes — The Immersive Footwear Boutique</title>
  <meta name="description" content="Step inside Toasty Toes — a first-person luxury footwear boutique. Walk through the mall, cross the threshold, and browse every department as if you were really there." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <!-- Dependencies are vendored locally (assets/vendor) so the boutique is
       fully self-contained: it loads offline, with no third-party CDN at runtime. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./assets/vendor/three/build/three.module.js",
      "three/addons/": "./assets/vendor/three/examples/jsm/",
      "gsap": "./assets/vendor/gsap/index.js"
    }
  }
  </script>
</head>
<body>
  <!-- 3D canvas -->
  <canvas id="scene"></canvas>

  <!-- Soft cinematic grain / vignette overlay is handled in the shader -->

  <!-- ============ LOADING ============ -->
  <div id="loader" class="loader">
    <div class="loader__mark">
      <span class="loader__logo">TOASTY&nbsp;TOES</span>
      <span class="loader__tag">FLAGSHIP&nbsp;BOUTIQUE</span>
    </div>
    <div class="loader__bar"><i id="loaderBar"></i></div>
    <div class="loader__hint" id="loaderHint">Preparing the boutique…</div>
  </div>

  <!-- ============ MALL / OPENING UI ============ -->
  <header id="mallUI" class="mallUI is-hidden">
    <div class="brand">
      <span class="brand__name">TOASTY&nbsp;TOES</span>
      <span class="brand__sub">EST. MMXXV · THE GRAND ARCADE</span>
    </div>
    <button id="exploreBtn" class="explore" type="button">
      <span class="explore__ring"></span>
      <span class="explore__label">Explore&nbsp;Collection</span>
      <span class="explore__arrow">↵</span>
    </button>
    <p class="mall__whisper">The doors are open. Step inside.</p>
  </header>

  <!-- ============ IN-STORE UI ============ -->
  <div id="storeUI" class="storeUI is-hidden">
    <div class="topbar">
      <button id="homeBtn" class="topbar__brand" type="button">TOASTY&nbsp;TOES</button>
      <div class="topbar__right">
        <button id="cartBtn" class="cartbtn" type="button">
          <span class="cartbtn__label">Shopping&nbsp;Bag</span>
          <span id="cartCount" class="cartbtn__count">0</span>
        </button>
      </div>
    </div>

    <div id="chips" class="chips"></div>

    <div class="nudge">
      <span class="nudge__key">◄ ►</span> turn your head · move the mouse to look
    </div>
  </div>

  <!-- ============ PRODUCT GLASS CARD ============ -->
  <aside id="product" class="product is-hidden">
    <button id="productClose" class="product__close" type="button" aria-label="Close">×</button>
    <div class="product__eyebrow" id="pEyebrow">WOMEN</div>
    <h2 class="product__name" id="pName">—</h2>
    <div class="product__price" id="pPrice">—</div>

    <div class="product__row">
      <span class="product__lbl">Colour</span>
      <div class="swatches" id="pColors"></div>
    </div>
    <div class="product__row">
      <span class="product__lbl">Size</span>
      <div class="sizes" id="pSizes"></div>
    </div>

    <div class="product__actions">
      <button id="quickView" class="btn btn--ghost" type="button">Quick&nbsp;View</button>
      <button id="addCart" class="btn btn--solid" type="button">Add&nbsp;to&nbsp;Bag</button>
    </div>
  </aside>

  <!-- ============ CART GLASS PANEL ============ -->
  <div id="cartPanel" class="cart">
    <div class="cart__scrim" id="cartScrim"></div>
    <div class="cart__glass">
      <div class="cart__head">
        <h3>Your Shopping Bag</h3>
        <button id="cartClose" class="cart__close" type="button" aria-label="Close">×</button>
      </div>
      <div id="cartItems" class="cart__items"></div>
      <div class="cart__foot">
        <div class="cart__total">
          <span>Subtotal</span>
          <strong id="cartTotal">$0</strong>
        </div>
        <button class="btn btn--solid btn--wide" type="button" id="checkoutBtn">Proceed to Checkout</button>
        <p class="cart__note">Complimentary shipping &amp; 30-day returns on every pair.</p>
      </div>
    </div>
  </div>

  <!-- ============ QUICK VIEW (macro) ============ -->
  <div id="quickPanel" class="quick">
    <div class="quick__scrim" id="quickScrim"></div>
    <div class="quick__glass">
      <button id="quickClose" class="quick__close" type="button" aria-label="Close">×</button>
      <div class="quick__eyebrow" id="qEyebrow">WOMEN</div>
      <h2 id="qName" class="quick__name">—</h2>
      <p id="qDesc" class="quick__desc"></p>
      <div class="quick__price" id="qPrice">—</div>
      <button class="btn btn--solid" id="qAdd" type="button">Add to Bag</button>
    </div>
  </div>

  <!-- ============ SOUND TOGGLE ============ -->
  <button id="soundBtn" class="sound is-hidden" type="button" aria-label="Toggle sound">
    <span class="sound__bars"><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="toast"></div>

  <!-- ============ WEBGL FALLBACK ============ -->
  <noscript>
    <div class="fallback">Toasty Toes needs JavaScript &amp; WebGL to open its doors.</div>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
